name: Bug report
description: Report incorrect exposure results, crashes, or documentation defects.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Do not include real secrets. For security vulnerabilities, use the private
        reporting link in SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What did ignore-drift report or do?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What result did you expect, and why?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include sanitized ignore rules, package metadata, command, and output.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ignore-drift version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system plus Node.js, npm, and Git versions.
    validations:
      required: true
